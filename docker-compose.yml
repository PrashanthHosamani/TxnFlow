services:

  db:
    image: postgres:17

    environment:
      POSTGRES_DB: txnflow
      POSTGRES_USER: txnflow
      POSTGRES_PASSWORD: txnflow

    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7

  web:
    build: .

    command: >
      sh -c "
      python manage.py migrate &&
      gunicorn TxnFlow.wsgi:application --bind 0.0.0.0:8000
      "

    volumes:
      - .:/app

    ports:
      - "8000:8000"

    env_file:
      - .env

    depends_on:
      - db
      - redis

  celery:
    build: .

    command: celery -A TxnFlow worker -l info

    volumes:
      - .:/app

    env_file:
      - .env

    depends_on:
      - db
      - redis

  # ─── Frontend ─────────────────────────────────────────────────────
  # Runs the Vite dev server inside Docker.
  # All /api requests from the browser hit localhost:5173/api,
  # Vite's proxy intercepts them and forwards to http://web:8000/api
  # ('web' is Docker Compose's internal DNS name for the Django service).
  # The browser never knows about port 8000.
  frontend:
    image: node:20

    working_dir: /app

    command: sh -c "npm install && npm run dev"

    volumes:
      - ./frontend:/app          # mounts your local frontend/ folder into the container
      - /app/node_modules        # anonymous volume so container's node_modules isn't overwritten

    ports:
      - "5173:5173"              # expose Vite dev server to your host machine

    depends_on:
      - web                      # wait for Django to be up before starting

volumes:
  postgres_data: