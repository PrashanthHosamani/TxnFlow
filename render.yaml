services:
  - type: web
    name: txnflow-backend
    env: python
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "python manage.py migrate && celery -A TxnFlow worker -l info --concurrency=1 & gunicorn TxnFlow.wsgi:application --workers 1 --threads 2"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: txnflow-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: txnflow-redis
          property: connectionString
      - key: GEMINI_API_KEY
        sync: false
      - key: PYTHON_VERSION
        value: "3.12.3"

  - type: web
    name: txnflow-frontend
    env: static
    buildCommand: "npm install --prefix frontend && npm run build --prefix frontend"
    staticPublishPath: ./frontend/dist
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: txnflow-backend
          property: host

  - type: redis
    name: txnflow-redis
    ipAllowList: []
    plan: free

databases:
  - name: txnflow-db
    plan: free
